<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>format-gr2 viewer</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1>format-gr2 viewer</h1>
        <div id="status"></div>
        <div id="dropzone">
          Drop a .gr2 file here or <button type="button" id="browse">browse</button>
        </div>
        <div id="sidebar-panel"></div>
        <div id="timeline"></div>
        <div id="inspector"></div>
      </aside>
      <main id="viewport"></main>
    </div>
  </body>
</html>
